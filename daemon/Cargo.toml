[package]
name = "tabsh"
version = "1.8.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Blaise1030/tabsh"
default-run = "tabsh"

[[bin]]
name = "tabsh"
path = "src/main.rs"

[[bin]]
name = "tabsctl"
path = "src/bin/tabsctl.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
ignore = "0.4"
libc = "0.2.190"
notify = "8.2"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "io-util"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
